name: FRISQ self-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/frisq.py scan . --output frisq-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: frisq-static-indicators
          path: frisq-report.json
